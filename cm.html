<!DOCTYPE html>
<html lang="fr">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace CM - TogoEnglish Play</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .back-home-btn { display: inline-flex; align-items: center; background: #FF5722; color: white; padding: 10px 20px; border-radius: 25px; text-decoration: none; font-weight: bold; margin-bottom: 30px; }
        .page-header { text-align: center; margin-bottom: 30px; }
        .page-header h1 { color: #FF5722; font-size: 2em; margin-bottom: 10px; }
        .unit-card { background: white; border-radius: 15px; padding: 25px; text-align: center; cursor: pointer; transition: transform 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .unit-card:hover { transform: translateY(-5px); }
        .unit-icon { font-size: 3em; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container" style="padding-top: 40px; padding-bottom: 40px;">
        <a href="/togo-english-play/students.html" class="back-home-btn">← Retour aux niveaux</a>
        <div class="page-header">
            <h1>🎓 Cours Moyen (CM1 & CM2)</h1>
            <p>Programme officiel du Ministère - 6 Unités • 24 semaines</p>
        </div>
        <div class="units-grid" id="unitsGrid"></div>
    </div>
    <script>
        fetch('/togo-english-play/data/videos-cm.json?' + Date.now())
            .then(r => r.json())
            .then(data => {
                const grid = document.getElementById('unitsGrid');
                Object.keys(data).forEach(key => {
                    const unit = data[key];
                    const card = document.createElement('div');
                    card.className = 'unit-card';
                    card.innerHTML = `<div class="unit-icon">${unit.icon}</div><h3>${unit.title}</h3><p>${unit.weeks.length} semaines</p>`;
                    grid.appendChild(card);
                });
            });
    </script>
</body>
</html>
