<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de Bord en Ligne - TogoEnglish Play</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .back-home-btn { display: inline-flex; align-items: center; background: #9C27B0; color: white; padding: 10px 20px; border-radius: 25px; text-decoration: none; font-weight: bold; margin-bottom: 30px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center; border-top: 5px solid #006A4E; }
        .stat-card h3 { color: #666; font-size: 0.9em; margin-bottom: 10px; text-transform: uppercase; }
        .stat-card .number { font-size: 2.5em; font-weight: bold; color: #006A4E; }
        .data-table { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #006A4E; color: white; padding: 12px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f9f9f9; }
        .loading { text-align: center; padding: 40px; font-size: 1.2em; color: #666; }
        .refresh-btn { background: #9C27B0; color: white; border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; font-weight: bold; margin-bottom: 20px; }
        .export-btn { background: #4CAF50; color: white; border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; font-weight: bold; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="container" style="padding-top: 40px; padding-bottom: 40px;">
        <a href="/togo-english-play/index.html" class="back-home-btn">← Retour à l'accueil</a>
        <h1 style="text-align: center; color: #9C27B0; margin-bottom: 20px;">📊 Tableau de Bord en Ligne</h1>
        <p style="text-align: center; color: #666; margin-bottom: 30px;">Statistiques en temps réel de toutes les tablettes</p>
        
        <div style="text-align: center; margin-bottom: 30px;">
            <button class="refresh-btn" onclick="loadData()">🔄 Actualiser</button>
            <button class="export-btn" onclick="exportToCSV()">📥 Exporter CSV</button>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card"><h3>Total des Visites</h3><div class="number" id="totalVisits">0</div></div>
            <div class="stat-card" style="border-top-color: #4CAF50;"><h3>Élèves</h3><div class="number" id="kidsCount" style="color: #4CAF50;">0</div></div>
            <div class="stat-card" style="border-top-color: #FF9800;"><h3>Parents</h3><div class="number" id="parentsCount" style="color: #FF9800;">0</div></div>
            <div class="stat-card" style="border-top-color: #2196F3;"><h3>Enseignants</h3><div class="number" id="teachersCount" style="color: #2196F3;">0</div></div>
        </div>

        <div class="data-table">
            <h3 style="color: #006A4E; margin-bottom: 20px;">📈 Dernières activités</h3>
            <div id="loading" class="loading">Chargement des données...</div>
            <table id="dataTable" style="display: none;">
                <thead>
                    <tr><th>Date/Heure</th><th>Page</th><th>Rôle</th><th>École</th><th>Région</th><th>Action</th><th>Durée (s)</th></tr>
                </thead>
                <tbody id="dataBody"></tbody>
            </table>
        </div>
    </div>
    <script>
        const GOOGLE_SHEETS_API = 'https://script.google.com/macros/s/AKfycbydAQxvXEGx-iFyWd6q7OErRkaUA69tGulCdS2ILL7oV84potH0r-FN541TU8paCYHf/exec';
        let allData = [];
        
        async function loadData() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('dataTable').style.display = 'none';
            try {
                const response = await fetch(GOOGLE_SHEETS_API);
                const result = await response.json();
                if (result.status === 'success') {
                    allData = result.data;
                    displayStats();
                    displayTable();
                } else {
                    document.getElementById('loading').textContent = 'Erreur: ' + result.message;
                }
            } catch (error) {
                document.getElementById('loading').textContent = 'Erreur de connexion.';
                console.error(error);
            }
        }
        
        function displayStats() {
            document.getElementById('totalVisits').textContent = allData.length;
            document.getElementById('kidsCount').textContent = allData.filter(d => d.Role === 'kids').length;
            document.getElementById('parentsCount').textContent = allData.filter(d => d.Role === 'parents').length;
            document.getElementById('teachersCount').textContent = allData.filter(d => d.Role === 'teachers').length;
        }
        
        function displayTable() {
            const tbody = document.getElementById('dataBody');
            tbody.innerHTML = '';
            const recentData = allData.slice(-50).reverse();
            recentData.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = \<td>\</td><td>\</td><td>\</td><td>\</td><td>\</td><td>\</td><td>\</td>\;
                tbody.appendChild(tr);
            });
            document.getElementById('loading').style.display = 'none';
            document.getElementById('dataTable').style.display = 'table';
        }
        
        function exportToCSV() {
            if (allData.length === 0) { alert('Aucune donnée à exporter'); return; }
            const headers = ['Timestamp', 'Page', 'Role', 'Device ID', 'School', 'Region', 'Action', 'Duration', 'Browser'];
            const csv = [headers.join(','), ...allData.map(row => [row.Timestamp, row.Page, row.Role, row['Device ID'], row.School, row.Region, row.Action, row.Duration, row.Browser].map(field => \"\"\).join(','))].join('\\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = \	ogo-english-stats-\.csv\;
            link.click();
        }
        loadData();
        setInterval(loadData, 30000);
    <\/script>
</body>
</html>
