<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de Bord - TogoEnglish Play</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .back-home-btn { display: inline-flex; align-items: center; background: #9C27B0; color: white; padding: 10px 20px; border-radius: 25px; text-decoration: none; font-weight: bold; margin-bottom: 30px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center; border-top: 5px solid #006A4E; }
        .stat-card h3 { color: #666; font-size: 0.9em; margin-bottom: 10px; text-transform: uppercase; }
        .stat-card .number { font-size: 2.5em; font-weight: bold; color: #006A4E; }
        .data-table { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #006A4E; color: white; padding: 12px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        .loading { text-align: center; padding: 40px; font-size: 1.2em; color: #666; }
        .error-msg { text-align: center; padding: 20px; color: #d32f2f; background: #ffebee; border-radius: 10px; display: none; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; margin: 10px 5px; color: white; text-decoration: none; display: inline-block; }
        .btn-refresh { background: #9C27B0; } 
        .btn-export { background: #4CAF50; } 
        .btn-sheet { background: #2196F3; }
    </style>
</head>
<body>
    <div class="container" style="padding-top: 40px; padding-bottom: 40px;">
        <a href="/togo-english-play/index.html" class="back-home-btn">← Retour à l'accueil</a>
        <h1 style="text-align: center; color: #9C27B0; margin-bottom: 20px;">📊 Tableau de Bord en Ligne</h1>
        <p style="text-align: center; color: #666; margin-bottom: 30px;">Statistiques en temps réel de toutes les tablettes</p>
        
        <div style="text-align: center; margin-bottom: 30px;">
            <button class="btn btn-refresh" onclick="loadData()">🔄 Actualiser</button>
            <button class="btn btn-export" onclick="exportCSV()">📥 Exporter CSV</button>
            <a href="https://docs.google.com/spreadsheets/d/1bFjp0pikoQARcpt8NgyOzB02EVMAG-dmbcXwdiq3wAs/edit" target="_blank" class="btn btn-sheet">📊 Voir le Google Sheet direct (Plan B)</a>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card"><h3>Total Visites</h3><div class="number" id="totalVisits">0</div></div>
            <div class="stat-card" style="border-top-color: #4CAF50;"><h3>Élèves</h3><div class="number" id="kidsCount" style="color: #4CAF50;">0</div></div>
            <div class="stat-card" style="border-top-color: #FF9800;"><h3>Parents</h3><div class="number" id="parentsCount" style="color: #FF9800;">0</div></div>
            <div class="stat-card" style="border-top-color: #2196F3;"><h3>Enseignants</h3><div class="number" id="teachersCount" style="color: #2196F3;">0</div></div>
        </div>

        <div class="data-table">
            <h3 style="color: #006A4E; margin-bottom: 20px;">📈 Dernières activités</h3>
            <div id="loading" class="loading">Chargement des données...</div>
            <div id="error" class="error-msg"></div>
            <table id="dataTable" style="display: none;">
                <thead><tr><th>Date</th><th>Page</th><th>Rôle</th><th>Action</th><th>Durée (s)</th></tr></thead>
                <tbody id="dataBody"></tbody>
            </table>
        </div>
    </div>
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbydAQxvXEGx-iFyWd6q7OErRkaUA69tGulCdS2ILL7oV84potH0r-FN541TU8paCYHf/exec';
        let allData = [];
        
        async function loadData() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('dataTable').style.display = 'none';
            
            try {
                // redirect: 'follow' est OBLIGATOIRE pour Google Apps Script
                const response = await fetch(API_URL, { 
                    method: 'GET', 
                    redirect: 'follow',
                    headers: { 'Accept': 'application/json' }
                });
                
                const text = await response.text();
                let result;
                try {
                    result = JSON.parse(text);
                } catch (e) {
                    throw new Error("Le script a renvoyé une page HTML au lieu de JSON. Vérifiez le déploiement.");
                }
                
                if (result.status === 'success') {
                    allData = result.data || [];
                    document.getElementById('totalVisits').textContent = allData.length;
                    document.getElementById('kidsCount').textContent = allData.filter(d => d.Role === 'kids').length;
                    document.getElementById('parentsCount').textContent = allData.filter(d => d.Role === 'parents').length;
                    document.getElementById('teachersCount').textContent = allData.filter(d => d.Role === 'teachers').length;
                    
                    const tbody = document.getElementById('dataBody');
                    tbody.innerHTML = '';
                    const recent = allData.slice(-50).reverse();
                    
                    if (recent.length === 0) {
                        document.getElementById('loading').textContent = 'Aucune donnée pour le moment. Naviguez dans l\'application pour en générer !';
                        document.getElementById('loading').style.display = 'block';
                    } else {
                        recent.forEach(row => {
                            const tr = document.createElement('tr');
                            const date = row.Timestamp ? new Date(row.Timestamp).toLocaleString('fr-FR') : '-';
                            const page = (row.Page || '-').replace('/togo-english-play/', '');
                            tr.innerHTML = '<td>'+date+'</td><td>'+page+'</td><td>'+(row.Role||'-')+'</td><td>'+(row.Action||'-')+'</td><td>'+(row.Duration||0)+'</td>';
                            tbody.appendChild(tr);
                        });
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('dataTable').style.display = 'table';
                    }
                } else {
                    throw new Error(result.message || 'Erreur inconnue du script');
                }
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                const errDiv = document.getElementById('error');
                errDiv.style.display = 'block';
                errDiv.innerHTML = '❌ Erreur de chargement : ' + err.message + '<br><br><strong>Solution immédiate :</strong> Cliquez sur le bouton bleu "Voir le Google Sheet direct" ci-dessus pour voir vos données en attendant.';
                console.error('Erreur Dashboard:', err);
            }
        }
        
        function exportCSV() {
            if (allData.length === 0) { alert('Aucune donnée à exporter'); return; }
            const headers = ['Timestamp', 'Page', 'Role', 'Device ID', 'School', 'Region', 'Action', 'Duration'];
            const csv = [headers.join(','), ...allData.map(r => headers.map(h => '"'+(r[h]||'')+'"').join(','))].join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'stats-togo-english-' + new Date().toISOString().split('T')[0] + '.csv';
            link.click();
        }
        
        // Chargement initial
        loadData();
        // Actualisation automatique toutes les 30 secondes
        setInterval(loadData, 30000);
    <\/script>
</body>
</html>
