<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de Bord Visuel - TogoEnglish Play</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .back-home-btn { display: inline-flex; align-items: center; background: #9C27B0; color: white; padding: 10px 20px; border-radius: 25px; text-decoration: none; font-weight: bold; margin-bottom: 30px; }
        .hero { text-align: center; padding: 40px 20px; background: linear-gradient(135deg, #9C27B0, #7B1FA2); border-radius: 25px; margin-bottom: 40px; color: white; }
        .hero h1 { font-size: 2.5em; margin-bottom: 15px; }
        .hero p { font-size: 1.2em; margin-bottom: 25px; }
        .dashboard-container { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); margin-bottom: 30px; overflow: hidden; }
        .dashboard-frame { width: 100%; height: 800px; border: none; border-radius: 10px; }
        .buttons { text-align: center; margin-top: 30px; }
        .btn { display: inline-block; padding: 15px 30px; border-radius: 30px; text-decoration: none; font-weight: bold; margin: 10px; color: white; transition: transform 0.2s; }
        .btn:hover { transform: translateY(-3px); }
        .btn-sheet { background: #2196F3; }
        .btn-looker { background: #4CAF50; }
    </style>
</head>
<body>
    <div class="container" style="padding-top: 40px; padding-bottom: 40px;">
        <a href="/togo-english-play/index.html" class="back-home-btn">← Retour à l'accueil</a>
        
        <div class="hero">
            <h1>📊 Tableau de Bord Analytique</h1>
            <p>Statistiques en temps réel avec graphiques interactifs</p>
        </div>

        <div class="dashboard-container">
            <iframe src="https://datastudio.google.com/embed/reporting/7c62ff3c-dc73-45c8-8021-a3c58a1c32c4/page/page_12345" class="dashboard-frame" frameborder="0" style="border:0" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
        </div>

        <div class="buttons">
            <a href="https://docs.google.com/spreadsheets/d/1bFjp0pikoQARcpt8NgyOzB02EVMAG-dmbcXwdiq3wAs/edit" target="_blank" class="btn btn-sheet">📊 Voir les données brutes (Google Sheet)</a>
            <a href="https://datastudio.google.com/reporting/7c62ff3c-dc73-45c8-8021-a3c58a1c32c4/page/page_12345" target="_blank" class="btn btn-looker">🔍 Ouvrir le rapport en plein écran</a>
        </div>
    </div>
</body>
</html>
