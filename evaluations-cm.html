        function showUnit(unitKey, btn) {
            document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const container = document.getElementById('evaluationsContainer');
            container.innerHTML = '';
            
            const unitData = evaluationsData[unitKey];
            
            Object.keys(unitData).forEach(key => {
                const evalData = unitData[key];
                const card = document.createElement('div');
                card.className = 'evaluation-card';
                
                let questionsHTML = '';
                evalData.questions.forEach(q => {
                    questionsHTML += '<div class="question">';
                    questionsHTML += '<p>' + q.text + '</p>';
                    if (q.items) {
                        questionsHTML += '<ul style="margin: 10px 0; padding-left: 20px;">';
                        q.items.forEach(item => {
                            questionsHTML += '<li style="margin: 5px 0;">' + item + '</li>';
                        });
                        questionsHTML += '</ul>';
                    }
                    if (q.headers && q.rows) {
                        questionsHTML += '<table><thead><tr>';
                        q.headers.forEach(h => questionsHTML += '<th>' + h + '</th>');
                        questionsHTML += '</tr></thead><tbody>';
                        q.rows.forEach(row => {
                            questionsHTML += '<tr>';
                            row.forEach(cell => questionsHTML += '<td>' + cell + '</td>');
                            questionsHTML += '</tr>';
                        });
                        questionsHTML += '</tbody></table>';
                    }
                    if (q.passage) {
                        questionsHTML += '<p style="background: #fff3cd; padding: 10px; border-radius: 5px; margin: 10px 0;"><em>' + q.passage + '</em></p>';
                    }
                    if (q.example) {
                        questionsHTML += '<p style="color: #666; font-style: italic;">' + q.example + '</p>';
                    }
                    questionsHTML += '</div>';
                });
                
                card.innerHTML = `
                    <h3>${evalData.title}</h3>
                    <p style="color: #666; font-style: italic;">${evalData.type}</p>
                    ${questionsHTML}
                    <div class="answer-key">
                        <h4>✅ Corrigé (Answer Key)</h4>
                        <p>${evalData.answers}</p>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }
        
        showUnit('preunit', document.querySelector('.unit-btn'));
