<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Enfants CP - TogoEnglish Play</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .back-home-btn { display: inline-flex; align-items: center; background: #4CAF50; color: white; padding: 10px 20px; border-radius: 25px; text-decoration: none; font-weight: bold; margin-bottom: 20px; }
        .back-home-btn:hover { background: #388E3C; }
        .header { background: linear-gradient(135deg, #006A4E, #00896a); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 30px; }
        .score-board { display: flex; justify-content: center; gap: 30px; margin-bottom: 30px; flex-wrap: wrap; }
        .score-item { background: white; padding: 20px 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; }
        .score-icon { font-size: 2em; display: block; margin-bottom: 10px; }
        .score-value { font-size: 2em; font-weight: bold; color: #006A4E; display: block; }
        .score-label { color: #666; }
        .units-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .unit-card { background: white; border-radius: 15px; padding: 25px; text-align: center; cursor: pointer; transition: transform 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-top: 5px solid #006A4E; }
        .unit-card:hover { transform: translateY(-5px); }
        .unit-icon { font-size: 3em; margin-bottom: 15px; }
        .week-card { background: white; border-radius: 15px; padding: 20px; text-align: center; cursor: pointer; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .week-card:hover { border: 2px solid #006A4E; }
        .lesson-content { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .video-card { background: #f9f9f9; border-radius: 10px; padding: 15px; margin-bottom: 20px; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 10px; margin-top: 10px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .flashcards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .flashcard { background: #f0f8ff; border-radius: 10px; padding: 15px; text-align: center; border: 2px solid #006A4E; }
        .flashcard-word { font-size: 1.2em; font-weight: bold; color: #006A4E; margin-bottom: 10px; text-transform: capitalize; }
        .back-btn { background: #006A4E; color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: bold; margin-bottom: 20px; }
        .complete-btn { background: #4CAF50; color: white; border: none; padding: 15px 30px; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 1.1em; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container" style="padding: 20px; max-width: 1000px; margin: 0 auto;">
        <a href="/togo-english-play/students.html" class="back-home-btn">← Retour aux niveaux</a>

        <div class="header">
            <h1>🎮 Espace Enfants CP</h1>
            <p>Apprends l'anglais en t'amusant avec Kossi et Afi !</p>
        </div>

        <div class="score-board">
            <div class="score-item">
                <span class="score-icon">⭐</span>
                <span class="score-value" id="totalStars">0</span>
                <span class="score-label">Étoiles</span>
            </div>
            <div class="score-item">
                <span class="score-icon">🏆</span>
                <span class="score-value" id="completedLessons">0</span>
                <span class="score-label">Leçons terminées</span>
            </div</div>

        <div id="unitsGrid" class="units-grid">
            <h2 style="color: #006A4E; text-align: center; margin-bottom: 20px; grid-column: 1/-1;">Choisis ton unité :</h2>
        </div>

        <div id="lessonContent" class="lesson-content" style="display: none;">
            <button type="button" onclick="goBack()" class="back-btn">← Retour aux unités</button>
            <div class="header" style="padding: 20px; margin-bottom: 20px;">
                <h2 id="lessonTitle" style="margin: 0;"></h2>
                <p id="lessonTheme" style="margin: 10px 0 0 0; opacity: 0.9;"></p>
            </div>
            <div class="video-section">
                <h3 style="color: #006A4E;">🎥 Vidéos de la semaine</h3>
                <div id="videoList"></div>
            </div>
            <div class="flashcards-section">
                <h3 style="color: #006A4E;">🔤 Apprends les mots</h3>
                <div id="flashcardsContainer" class="flashcards-grid"></div>
            </div>
            <button type="button" onclick="completeLesson()" class="complete-btn">✅ J'ai terminé ! (+5 ⭐)</button>
            <button type="button" onclick="goBack()" class="back-btn" style="margin-top: 15px; width: 100%; background: #757575;">← Retour aux unités</button>
        </div>

        <footer style="text-align: center; padding: 30px; color: #666;">
            <p>© 2026 OBG International - Cres Poly Art. Tous droits réservés.</p>
        </footer>
    </div>

    <script>
    // DONNÉES INTÉGRÉES DIRECTEMENT (Plus de problème de chargement !)
    const programData = {
      "preunit": { "title": "PRÉ-UNITÉ : Souvenons-nous", "icon": "📚", "weeks": [ { "week": 1, "theme": "Salutations et alphabet - Partie 1", "videos": [ {"day": 1, "type": "song", "title": "Hello Song", "youtubeId": "Z1fEp-uYfQk", "objective": "Apprendre à dire Hello"} ] }, { "week": 2, "theme": "Salutations et alphabet - Partie 2", "videos": [ {"day": 1, "type": "song", "title": "Good Morning Song", "youtubeId": "7CgUneBvKxo", "objective": "Dire Good morning"} ] }, { "week": 3, "theme": "Salutations et alphabet - Partie 3", "videos": [ {"day": 1, "type": "song", "title": "How Are You?", "youtubeId": "7CgUneBvKxo", "objective": "Demander comment ça va"} ] } ] },
      "unit1": { "title": "UNITÉ 1 : Mon école", "icon": "👨‍👩‍👧", "weeks": [ { "week": 1, "theme": "Objets scolaires - Partie 1", "videos": [ {"day": 1, "type": "song", "title": "School Supplies Song", "youtubeId": "yOBBPMIiVwA", "objective": "Vocabulaire du cartable"} ] }, { "week": 2, "theme": "Objets scolaires - Partie 2", "videos": [ {"day": 1, "type": "lesson", "title": "Colors of Objects", "youtubeId": "YBnUGKZomz4", "objective": "Associer couleurs et objets"} ] }, { "week": 3, "theme": "Objets scolaires - Partie 3", "videos": [ {"day": 1, "type": "song", "title": "Classroom Song", "youtubeId": "yOBBPMIiVwA", "objective": "Vocabulaire de la classe"} ] } ] },
      "unit2": { "title": "UNITÉ 2 : Mon identité", "icon": "🍎", "weeks": [ { "week": 1, "theme": "Mon nom et mon âge", "videos": [ {"day": 1, "type": "song", "title": "What's Your Name?", "youtubeId": "Z1fEp-uYfQk", "objective": "Se présenter"} ] }, { "week": 2, "theme": "Ma famille", "videos": [ {"day": 1, "type": "song", "title": "Family Song", "youtubeId": "5ONPPjYCPE4", "objective": "Vocabulaire de la famille"} ] }, { "week": 3, "theme": "Mon corps", "videos": [ {"day": 1, "type": "song", "title": "Head Shoulders Knees and Toes", "youtubeId": "Z4fHZoExI9Y", "objective": "Parties du corps"} ] } ] },
      "unit3": { "title": "UNITÉ 3 : Alimentation", "icon": "⚽", "weeks": [ { "week": 1, "theme": "Fruits", "videos": [ {"day": 1, "type": "song", "title": "Fruit Song", "youtubeId": "YBnUGKZomz4", "objective": "Nommer les fruits"} ] }, { "week": 2, "theme": "Légumes et boissons", "videos": [ {"day": 1, "type": "song", "title": "Vegetables Song", "youtubeId": "YBnUGKZomz4", "objective": "Nommer les légumes"} ] }, { "week": 3, "theme": "Repas et préférences", "videos": [ {"day": 1, "type": "song", "title": "Breakfast Lunch Dinner", "youtubeId": "YBnUGKZomz4", "objective": "Les repas"} ] } ] },
      "unit4": { "title": "UNITÉ 4 : Activités physiques", "icon": "🧼", "weeks": [ { "week": 1, "theme": "Actions - Partie 1", "videos": [ {"day": 1, "type": "song", "title": "Action Song", "youtubeId": "Z4fHZoExI9Y", "objective": "Verbes d'action"} ] }, { "week": 2, "theme": "Actions - Partie 2", "videos": [ {"day": 1, "type": "song", "title": "Sports Song", "youtubeId": "Z4fHZoExI9Y", "objective": "Vocabulaire du sport"} ] } ] },
      "unit5": { "title": "UNITÉ 5 : Habitudes saines", "icon": "🦁", "weeks": [ { "week": 1, "theme": "Hygiène - Partie 1", "videos": [ {"day": 1, "type": "song", "title": "Brush Your Teeth", "youtubeId": "7CgUneBvKxo", "objective": "Se brosser les dents"} ] }, { "week": 2, "theme": "Hygiène - Partie 2", "videos": [ {"day": 1, "type": "song", "title": "Clean Song", "youtubeId": "7CgUneBvKxo", "objective": "Être propre"} ] } ] },
      "unit6": { "title": "UNITÉ 6 : Animaux domestiques et sauvages", "icon": "📖", "weeks": [ { "week": 1, "theme": "Animaux domestiques", "videos": [ {"day": 1, "type": "song", "title": "Old MacDonald", "youtubeId": "5ONPPjYCPE4", "objective": "Animaux de la ferme"} ] }, { "week": 2, "theme": "Animaux sauvages", "videos": [ {"day": 1, "type": "song", "title": "Jungle Animals", "youtubeId": "5ONPPjYCPE4", "objective": "Animaux sauvages"} ] } ] }
    };

    let currentUnit = null;
    let totalStars = parseInt(localStorage.getItem('totalStars')) || 0;
    let completedLessons = parseInt(localStorage.getItem('completedLessons')) || 0;

    function displayUnits() {
        const grid = document.getElementById('unitsGrid');
        grid.innerHTML = '<h2 style="color: #006A4E; text-align: center; margin-bottom: 20px; grid-column: 1/-1;">Choisis ton unité :</h2>';
        Object.keys(programData).forEach(key => {
            const unit = programData[key];
            const card = document.createElement('div');
            card.className = 'unit-card';
            card.onclick = () => selectUnit(key);
            card.innerHTML = `<div class="unit-icon">${unit.icon}</div><h3 style="color:#006A4E;">${unit.title}</h3><p style="color:#666;">${unit.weeks.length} semaine(s)</p>`;
            grid.appendChild(card);
        });
        updateScore();
    }

    function selectUnit(unitKey) {
        currentUnit = unitKey;
        const unit = programData[unitKey];
        const grid = document.getElementById('unitsGrid');
        grid.innerHTML = `<h2 style="color: #006A4E; text-align: center; margin-bottom: 20px; grid-column: 1/-1;">${unit.icon} ${unit.title}</h2>
                          <button type="button" onclick="displayUnits()" class="back-btn" style="grid-column: 1/-1; justify-self: center; margin-bottom: 20px;">← Retour aux unités</button>`;
        unit.weeks.forEach((week, i) => {
            const card = document.createElement('div');
            card.className = 'week-card';
            card.onclick = () => selectWeek(i);
            card.innerHTML = `<h3 style="color:#333;">Semaine ${week.week}</h3><p style="color:#666;">${week.theme}</p><p style="color:#006A4E; font-weight: bold;">${week.videos.length} vidéo(s)</p>`;
            grid.appendChild(card);
        });
    }

    function selectWeek(weekIndex) {
        const week = programData[currentUnit].weeks[weekIndex];
        document.getElementById('unitsGrid').style.display = 'none';
        document.getElementById('lessonContent').style.display = 'block';
        document.getElementById('lessonTitle').textContent = programData[currentUnit].title;
        document.getElementById('lessonTheme').textContent = `Semaine ${week.week} - ${week.theme}`;

        const videoList = document.getElementById('videoList');
        videoList.innerHTML = '';
        week.videos.forEach(v => {
            const div = document.createElement('div');
            div.className = 'video-card';
            div.innerHTML = `<div style="background:#006A4E; color:white; padding:5px 10px; border-radius:5px; display:inline-block; font-size:0.8em; margin-bottom:5px;">${v.type.toUpperCase()} - Jour ${v.day}</div>
                             <h4 style="margin: 10px 0;">${v.title}</h4>
                             <div class="video-container"><iframe src="https://www.youtube-nocookie.com/embed/${v.youtubeId}" allowfullscreen></iframe></div>
                             <p style="color:#555; margin-top:10px;">🎯 ${v.objective}</p>`;
            videoList.appendChild(div);
        });

        const fc = document.getElementById('flashcardsContainer');
        fc.innerHTML = '';
        const keywords = ["Hello", "School", "Apple", "Run", "Clean", "Dog"];
        keywords.forEach(word => {
            const card = document.createElement('div');
            card.className = 'flashcard';
            card.innerHTML = `<div class="flashcard-word">${word}</div><button type="button" onclick="speakWord('${word}')" style="background:#006A4E; color:white; border:none; padding:8px 15px; border-radius:20px; cursor:pointer;">🔊 Écouter</button>`;
            fc.appendChild(card);
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goBack() {
        document.getElementById('lessonContent').style.display = 'none';
        document.getElementById('unitsGrid').style.display = 'grid';
        if (currentUnit) selectUnit(currentUnit);
        else displayUnits();
    }

    function speakWord(word) {
        if ('speechSynthesis' in window) {
            const u = new SpeechSynthesisUtterance(word);
            u.lang = 'en-US'; u.rate = 0.8;
            speechSynthesis.speak(u);
        }
    }

    function completeLesson() {
        completedLessons++; totalStars += 5;
        localStorage.setItem('completedLessons', completedLessons);
        localStorage.setItem('totalStars', totalStars);
        updateScore();
        alert(`🎉 Félicitations ! +5 étoiles !\nTotal : ${totalStars} ⭐`);
        goBack();
    }

    function updateScore() {
        document.getElementById('totalStars').textContent = totalStars;
        document.getElementById('completedLessons').textContent = completedLessons;
    }

    // Lancer l'affichage au chargement
    displayUnits();
    </script>
    <script src="/togo-english-play/js/analytics.js"></script>
</body>
</html>
