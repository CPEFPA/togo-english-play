<!DOCTYPE html>
<html lang="fr">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Enfants CP - TogoEnglish Play</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#006A4E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        .back-home-btn { display: inline-flex; align-items: center; background: #4CAF50; color: white; padding: 10px 20px; border-radius: 25px; text-decoration: none; font-weight: bold; margin-bottom: 20px; transition: all 0.3s; }
        .back-home-btn:hover { transform: translateY(-2px); background: #388E3C; }
    </style>
</head>
<body>
    <div class="container">
        <!-- UN SEUL BOUTON : Retour aux niveaux -->
        <a href="/togo-english-play/students.html" class="back-home-btn">← Retour aux niveaux</a>

        <header class="header" style="background: linear-gradient(135deg, #006A4E, #00896a); border-radius: 15px; padding: 30px; text-align: center; color: white; margin-bottom: 30px;">
            <h1 style="margin: 0 0 10px 0;">🎮 Espace Enfants CP</h1>
            <p style="margin: 0; opacity: 0.9;">Apprends l'anglais en t'amusant avec Kossi et Afi !</p>
        </header>

        <div class="score-board" style="display: flex; justify-content: center; gap: 30px; margin-bottom: 30px; flex-wrap: wrap;">
            <div class="score-item" style="background: white; padding: 20px 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center;">
                <span class="score-icon" style="font-size: 2em; display: block; margin-bottom: 10px;">⭐</span>
                <span class="score-value" id="totalStars" style="font-size: 2em; font-weight: bold; color: #006A4E; display: block;">0</span>
                <span class="score-label" style="color: #666;">Étoiles</span>
            </div>
            <div class="score-item" style="background: white; padding: 20px 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center;">
                <span class="score-icon" style="font-size: 2em; display: block; margin-bottom: 10px;">🏆</span>
                <span class="score-value" id="completedLessons" style="font-size: 2em; font-weight: bold; color: #006A4E; display: block;">0</span>
                <span class="score-label" style="color: #666;">Leçons terminées</span>
            </div>
        </div>

        <div class="units-grid" id="unitsGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px;">
            <h2 style="color: white; text-align: center; margin-bottom: 20px; grid-column: 1/-1;">Choisis ton unité :</h2>
        </div>

        <div id="lessonContent" class="lesson-content" style="display: none; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
            <button type="button" onclick="goBack()" class="back-btn" style="background: #006A4E; color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: bold; margin-bottom: 20px;">← Retour aux unités</button>
            <div class="lesson-header" style="text-align: center; margin-bottom: 30px;">
                <h2 id="lessonTitle" style="color: #006A4E; margin-bottom: 10px;"></h2>
                <p id="lessonTheme" style="font-size: 1.2em; color: #666;"></p>
            </div>
            <div class="video-section" style="margin-bottom: 30px;">
                <h3 style="color: #006A4E; border-bottom: 2px solid #006A4E; padding-bottom: 10px; margin-bottom: 20px;">🎥 Vidéos de la semaine</h3>
                <div id="videoList"></div>
            </div>
            <div class="flashcards-section" style="margin-bottom: 30px;">
                <h3 style="color: #006A4E; border-bottom: 2px solid #006A4E; padding-bottom: 10px; margin-bottom: 20px;">🔤 Apprends les mots</h3>
                <div id="flashcardsContainer" class="flashcards-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px;"></div>
            </div>
            <div class="quiz-section" style="margin-bottom: 30px;">
                <h3 style="color: #006A4E; border-bottom: 2px solid #006A4E; padding-bottom: 10px; margin-bottom: 20px;">🎯 Teste tes connaissances</h3>
                <div id="quizContainer"></div>
            </div>
            <button type="button" onclick="completeLesson()" class="complete-btn" style="background: #4CAF50; color: white; border: none; padding: 15px 30px; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 1.1em; width: 100%; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(76,175,80,0.4);">✅ J'ai terminé ! (+5 ⭐)</button>
            <button type="button" onclick="goBack()" class="back-btn" style="background: #757575; color: white; border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; font-weight: bold; width: 100%;">← Retour aux unités</button>
        </div>

        <footer class="footer" style="text-align: center; padding: 30px; color: #666; margin-top: 40px;">
            <p>© 2026 OBG International - Cres Poly Art. Tous droits réservés.</p>
        </footer>
    </div>

    <script>
    let programData = {};
    let currentUnit = null;
    let totalStars = parseInt(localStorage.getItem('totalStars')) || 0;
    let completedLessons = parseInt(localStorage.getItem('completedLessons')) || 0;

    // Ajout de Date.now() pour éviter le cache du navigateur
    fetch('/togo-english-play/data/videos.json?' + Date.now())
        .then(r => { if (!r.ok) throw new Error("Fichier non trouvé"); return r.json(); })
        .then(data => { programData = data; displayUnits(); updateScore(); })
        .catch(e => {
            console.error('Erreur:', e);
            document.getElementById('unitsGrid').innerHTML = '<p style="color: white; text-align: center; grid-column: 1/-1; background: #ff5252; padding: 20px; border-radius: 15px;">⚠️ Impossible de charger les données. Vérifiez votre connexion.</p>';
        });

    function displayUnits() {
        const grid = document.getElementById('unitsGrid');
        grid.innerHTML = '<h2 style="color: white; text-align: center; margin-bottom: 20px; grid-column: 1/-1;">Choisis ton unité :</h2>';
        const icons = ['📚','👨‍👩‍👧','🍎','⚽','🧼','🦁', '📖'];
        Object.keys(programData).forEach((key, i) => {
            const unit = programData[key];
            const card = document.createElement('div');
            card.className = 'unit-card';
            card.style = "background: white; border-radius: 15px; padding: 25px; text-align: center; cursor: pointer; transition: transform 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-top: 5px solid #006A4E;";
            card.onmouseover = function() { this.style.transform = 'translateY(-5px)'; };
            card.onmouseout = function() { this.style.transform = 'translateY(0)'; };
            card.onclick = () => selectUnit(key);
            card.innerHTML = `<div style="font-size: 3em; margin-bottom: 15px;">${icons[i] || '📖'}</div><h3 style="color: #006A4E; margin-bottom: 10px;">${unit.title}</h3><p style="color: #666;">${unit.weeks.length} semaines</p>`;
            grid.appendChild(card);
        });
    }

    function selectUnit(unitKey) {
        currentUnit = unitKey;
        const unit = programData[unitKey];
        const grid = document.getElementById('unitsGrid');
        grid.innerHTML = `<h2 style="color: white; text-align: center; margin-bottom: 20px; grid-column: 1/-1;">${unit.title}</h2>
            <button type="button" onclick="displayUnits()" style="grid-column: 1/-1; background: #006A4E; color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: bold; margin-bottom: 20px; justify-self: center;">← Retour aux unités</button>`;
        unit.weeks.forEach((week, i) => {
            const card = document.createElement('div');
            card.className = 'week-card';
            card.style = "background: white; border-radius: 15px; padding: 20px; text-align: center; cursor: pointer; transition: transform 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.1);";
            card.onmouseover = function() { this.style.transform = 'translateY(-3px)'; this.style.border = '2px solid #006A4E'; };
            card.onmouseout = function() { this.style.transform = 'translateY(0)'; this.style.border = 'none'; };
            card.onclick = () => selectWeek(i);
            card.innerHTML = `<h3 style="color: #333; margin-bottom: 10px;">Semaine ${week.week}</h3><p style="color: #666; margin-bottom: 10px;">${week.theme}</p><p style="color: #FF6B6B; font-weight: bold;">${week.videos.length} vidéo(s)</p>`;
            grid.appendChild(card);
        });
    }

    function selectWeek(weekIndex) {
        const week = programData[currentUnit].weeks[weekIndex];
        document.getElementById('unitsGrid').style.display = 'none';
        document.getElementById('lessonContent').style.display = 'block';
        document.getElementById('lessonTitle').textContent = programData[currentUnit].title;
        document.getElementById('lessonTheme').textContent = `Semaine ${week.week} - ${week.theme}`;

        const videoList = document.getElementById('videoList');
        videoList.innerHTML = '';
        week.videos.forEach(v => {
            let videoId = v.youtubeId || '';
            if (!videoId && v.url) {
                if (v.url.includes('v=')) videoId = v.url.split('v=')[1].split('&')[0];
                else if (v.url.includes('youtu.be/')) videoId = v.url.split('youtu.be/')[1];
            }
            const div = document.createElement('div');
            div.className = 'video-card';
            div.style = "background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-bottom: 25px;";
            div.innerHTML = `<div style="background: #006A4E; color: white; padding: 8px 15px; font-size: 0.9em; font-weight: bold;">${v.type ? v.type.toUpperCase() : 'VIDEO'}</div>
                <h3 style="padding: 15px 15px 5px; margin: 0; font-size: 1.1em; color: #333;">${v.title}</h3>
                <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;"><iframe src="https://www.youtube-nocookie.com/embed/${videoId}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" allowfullscreen></iframe></div>
                <p style="padding: 15px; color: #555; margin: 0;">🎯 ${v.objective || ''}</p>`;
            videoList.appendChild(div);
        });

        const keywords = extractKeywords(week.theme);
        const fc = document.getElementById('flashcardsContainer');
        fc.innerHTML = '';
        keywords.forEach(word => {
            const card = document.createElement('div');
            card.className = 'flashcard';
            card.style = "background: white; border-radius: 15px; padding: 20px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1);";
            card.innerHTML = `<div style="font-size: 1.3em; font-weight: bold; color: #006A4E; margin-bottom: 10px; text-transform: capitalize;">${word}</div><button type="button" onclick="speakWord('${word}')" style="background: #006A4E; color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold;">🔊 Écouter</button>`;
            fc.appendChild(card);
        });

        createQuiz(keywords);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function extractKeywords(theme) {
        const t = theme.toLowerCase();
        if (t.includes('greet') || t.includes('alphabet')) return ['Hello','Good morning','Good afternoon','A','B','C'];
        if (t.includes('family') || t.includes('identity')) return ['Father','Mother','Brother','Sister','Name'];
        if (t.includes('fruit') || t.includes('food')) return ['Apple','Banana','Mango','Orange','Rice'];
        if (t.includes('body') || t.includes('sport') || t.includes('physical')) return ['Head','Hand','Foot','Eye','Nose'];
        if (t.includes('hygien') || t.includes('health')) return ['Teeth','Hands','Soap','Water','Clean'];
        if (t.includes('animal')) return ['Cat','Dog','Cow','Lion','Elephant'];
        return ['Hello','School','Teacher','Book','Pen','Friend'];
    }

    function speakWord(word) {
        if ('speechSynthesis' in window) {
            const u = new SpeechSynthesisUtterance(word);
            u.lang = 'en-US'; u.rate = 0.8;
            speechSynthesis.speak(u);
        }
    }

    function createQuiz(keywords) {
        const container = document.getElementById('quizContainer');
        if (keywords.length < 2) { container.innerHTML = '<p style="color: #666; text-align: center;">Pas de quiz pour cette semaine.</p>'; return; }
        // Mélanger les options pour que la bonne réponse ne soit pas toujours au même endroit
        const options = [keywords[0], keywords[1], 'Apple', 'Book'].sort(() => Math.random()
