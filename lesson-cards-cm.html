    <link rel="stylesheet" href="css/style.css">
    <style>
        .back-home-btn { display: inline-flex; align-items: center; background: #FF5722; color: white; padding: 10px 20px; border-radius: 25px; text-decoration: none; font-weight: bold; margin-bottom: 30px; }
        .page-header { text-align: center; margin-bottom: 40px; }
        .page-header h1 { color: #FF5722; font-size: 2.5em; margin-bottom: 15px; }
        .page-header p { color: #666; font-size: 1.2em; }
        
        .unit-selector { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .unit-btn { padding: 12px 20px; border: none; background: #e0e0e0; border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 0.95em; transition: all 0.3s; }
        .unit-btn.active { background: #FF5722; color: white; }
        
        .lesson-card { background: white; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); margin-bottom: 30px; overflow: hidden; }
        .lesson-card-header { background: #FF5722; color: white; padding: 20px; }
        .lesson-card-header h2 { margin: 0; font-size: 1.5em; }
        .lesson-card-header p { margin: 5px 0 0 0; opacity: 0.9; }
        
        .lesson-card-body { padding: 25px; }
        .info-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .info-item { background: #f9f9f9; padding: 15px; border-radius: 10px; }
        .info-item label { font-weight: bold; color: #FF5722; display: block; margin-bottom: 5px; }
        .info-item span { color: #555; }
        
        .section-title { color: #FF5722; font-size: 1.2em; margin-top: 25px; margin-bottom: 15px; border-bottom: 2px solid #FF5722; padding-bottom: 5px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background: #FF5722; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border: 1px solid #ddd; vertical-align: top; }
        tr:nth-child(even) { background: #f9f9f9; }
        
        .vocab-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .vocab-item { background: #FFE66D; padding: 8px 15px; border-radius: 20px; font-weight: bold; }
        
        .objective-list { line-height: 1.8; }
        .objective-list li { margin-bottom: 8px; }
        
        .print-btn { background: #FF5722; color: white; padding: 12px 25px; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        .print-btn:hover { background: #E64A19; }
        
        @media print {
            .back-home-btn, .unit-selector, .print-btn { display: none; }
            .lesson-card { page-break-inside: avoid; }
        }
    </style>
</head>

        function showUnit(unitKey, btn) {
            document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const container = document.getElementById('lessonCardsContainer');
            container.innerHTML = '';
            
            const cards = lessonCardsData[unitKey];
            cards.forEach(card => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'lesson-card';
                
                let vocabHTML = '<div class="vocab-list">';
                card.vocab.forEach(v => {
                    vocabHTML += `<span class="vocab-item">${v}</span>`;
                });
                vocabHTML += '</div>';
                
                let objectivesHTML = '<ul class="objective-list">';
                card.objectives.forEach(obj => {
                    objectivesHTML += `<li>➢ ${obj}</li>`;
                });
                objectivesHTML += '</ul>';
                
                let stepsHTML = '<table><thead><tr><th>Steps</th><th>Teacher\'s Activities</th><th>Learner\'s Activities</th><th>Instructions</th></tr></thead><tbody>';
                card.steps.forEach(step => {
                    stepsHTML += `<tr><td><strong>${step.step}</strong></td><td>${step.teacher}</td><td>${step.learner}</td><td>${step.instruction}</td></tr>`;
                });
                stepsHTML += '</tbody></table>';
                
                cardDiv.innerHTML = `
                    <div class="lesson-card-header">
                        <h2>${card.unit} - Week ${card.week}</h2>
                        <p>${card.theme}</p>
                    </div>
                    <div class="lesson-card-body">
                        <div class="info-row">
                            <div class="info-item">
                                <label>Unit</label>
                                <span>${card.unit}</span>
                            </div>
                            <div class="info-item">
                                <label>Week</label>
                                <span>Week ${card.week}</span>
                            </div>
                            <div class="info-item">
                                <label>Duration</label>
                                <span>${card.duration}</span>
                            </div>
                        </div>
                        
                        <h3 class="section-title">🎯 Specific Objectives</h3>
                        ${objectivesHTML}
                        
                        <h3 class="section-title">📚 Target Vocabulary</h3>
                        ${vocabHTML}
                        
                        <h3 class="section-title">🎒 Resources</h3>
                        <p>${card.resources.join(', ')}</p>
                        
                        <h3 class="section-title">📋 Learning Steps</h3>
                        ${stepsHTML}
                    </div>
                `;
                
                container.appendChild(cardDiv);
            });
        }
