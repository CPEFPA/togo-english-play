<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - TogoEnglish Play</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 10px;
        }
        .header p {
            color: #666;
            font-size: 1.1em;
        }
        .role-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .role-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 20px 30px;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .role-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        .role-btn:active {
            transform: translateY(0);
        }
        .skip-link {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #667eea;
            text-decoration: none;
            font-size: 0.95em;
        }
        .skip-link:hover {
            text-decoration: underline;
        }
        .icon {
            font-size: 1.5em;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🇹🇬 TogoEnglish Play</h1>
            <p>Qui utilise l'application aujourd'hui ?</p>
        </div>

        <div class="role-buttons">
            <button class="role-btn" onclick="selectRole('kids')">
                <span class="icon">🎓</span>
                Je suis un Élève
            </button>
            <button class="role-btn" onclick="selectRole('parents')">
                <span class="icon">👨‍👩‍👧</span>
                Je suis un Parent
            </button>
            <button class="role-btn" onclick="selectRole('teachers')">
                <span class="icon">👩‍🏫</span>
                Je suis un Enseignant
            </button>
            <button class="role-btn" onclick="selectRole('visitor')">
                <span class="icon">👀</span>
                Je suis un Visiteur
            </button>
        </div>

        <a href="index.html" class="skip-link">Continuer sans se connecter →</a>
    </div>

    <script>
        function selectRole(role) {
            localStorage.setItem('userRole', role);
            localStorage.setItem('loginTime', new Date().toISOString());
            
            var redirects = {
                'kids': 'students.html',
                'parents': 'parents.html',
                'teachers': 'teachers.html',
                'visitor': 'index.html'
            };
            
            var targetPage = redirects[role] || 'index.html';
            window.location.href = targetPage;
        }
    </script>
</body>
</html>
