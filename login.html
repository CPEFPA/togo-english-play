<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - TogoEnglish Play</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background: linear-gradient(135deg, #006A4E 0%, #00896a 50%, #00A87E 100%); min-height: 100vh; margin: 0; padding: 0; font-family: sans-serif; }
        .login-wrapper { max-width: 500px; margin: 0 auto; padding: 40px 20px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
        .login-card { background: white; border-radius: 25px; padding: 40px 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
        .logo-section { margin-bottom: 25px; }
        .logo-flag { font-size: 3em; margin-bottom: 10px; }
        .login-card h1 { color: #006A4E; font-size: 2em; margin: 0 0 5px 0; }
        .login-card .subtitle { color: #666; font-size: 1em; margin-bottom: 30px; }
        .role-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 25px; }
        .role-btn { display: flex; align-items: center; padding: 20px; border: 3px solid #e0e0e0; border-radius: 20px; background: white; cursor: pointer; transition: all 0.3s; text-align: left; font-size: 1em; width: 100%; }
        .role-btn:hover { border-color: #006A4E; transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,106,78,0.2); }
        .role-btn .icon { font-size: 2.5em; margin-right: 20px; }
        .role-btn .info { flex: 1; }
        .role-btn .info h3 { margin: 0 0 5px 0; color: #006A4E; font-size: 1.2em; }
        .role-btn .info p { margin: 0; color: #666; font-size: 0.9em; }
        .role-btn.kids { border-color: #4CAF50; }
        .role-btn.kids:hover { background: #f1f8e9; }
        .role-btn.parents { border-color: #FF9800; }
        .role-btn.parents:hover { background: #fff3e0; }
        .role-btn.teachers { border-color: #2196F3; }
        .role-btn.teachers:hover { background: #e3f2fd; }
        .role-btn.visitor { border-color: #9C27B0; }
        .role-btn.visitor:hover { background: #f3e5f5; }
        .footer-text { color: white; text-align: center; margin-top: 30px; font-size: 0.9em; opacity: 0.9; }
        .footer-text a { color: white; text-decoration: none; font-weight: bold; }
        .mascots { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .mascot { width: 70px; height: 70px; border-radius: 50%; background: #FFE66D; display: flex; align-items: center; justify-content: center; font-size: 2.5em; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo-section">
                <div class="logo-flag">🇹🇬</div>
                <div class="mascots">
                    <div class="mascot">👦</div>
                    <div class="mascot">👧</div>
                </div>
                <h1>TogoEnglish Play</h1>
                <p class="subtitle">Qui utilise l'application aujourd'hui ?</p>
            </div>

            <div class="role-grid">
                <button class="role-btn kids" onclick="selectRole('kids')">
                    <div class="icon">🎓</div>
                    <div class="info">
                        <h3>Je suis un Élève</h3>
                        <p>CP, CE ou CM - J'apprends l'anglais en jouant</p>
                    </div>
                </button>

                <button class="role-btn parents" onclick="selectRole('parents')">
                    <div class="icon">👨‍👩‍👧</div>
                    <div class="info">
                        <h3>Je suis un Parent</h3>
                        <p>J'accompagne mon enfant dans son apprentissage</p>
                    </div>
                </button>

                <button class="role-btn teachers" onclick="selectRole('teachers')">
                    <div class="icon">👩‍🏫</div>
                    <div class="info">
                        <h3>Je suis un Enseignant</h3>
                        <p>J'utilise les ressources pédagogiques</p>
                    </div>
                </button>

                <button class="role-btn visitor" onclick="selectRole('visitor')">
                    <div class="icon">👀</div>
                    <div class="info">
                        <h3>Je suis un Visiteur</h3>
                        <p>Je découvre simplement l'application</p>
                    </div>
                </button>
            </div>
        </div>

        <div class="footer-text">
            <p>Programme d'introduction de l'anglais au primaire<br>
            République Togolaise 🇹🇬</p>
            <p><a href="/togo-english-play/index.html">← Continuer sans se connecter</a></p>
        </div>
    </div>

    <script>
        function selectRole(role) {
            localStorage.setItem('userRole', role);
            localStorage.setItem('loginTime', new Date().toISOString());
            window.location.href = '/togo-english-play/index.html';
        }
    </script>
</body>
</html>
