<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Fond circulaire avec dégradé vert -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#006A4E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A87E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE66D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC107;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cercle principal -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="#FFE66D" stroke-width="3"/>
  
  <!-- Bande horizontale jaune (drapeau) -->
  <rect x="15" y="90" width="170" height="20" fill="#FFE66D" opacity="0.3"/>
  
  <!-- Étoile rouge (drapeau togolais) -->
  <polygon points="100,30 105,45 120,45 108,55 113,70 100,60 87,70 92,55 80,45 95,45" fill="#D21034"/>
  
  <!-- Livre ouvert -->
  <path d="M 50 110 Q 50 105 55 105 L 95 105 L 95 150 L 55 150 Q 50 150 50 145 Z" fill="url(#bookGradient)" stroke="#006A4E" stroke-width="2"/>
  <path d="M 150 110 Q 150 105 145 105 L 105 105 L 105 150 L 145 150 Q 150 150 150 145 Z" fill="url(#bookGradient)" stroke="#006A4E" stroke-width="2"/>
  
  <!-- Lignes du livre -->
  <line x1="60" y1="115" x2="90" y2="115" stroke="#006A4E" stroke-width="1.5"/>
  <line x1="60" y1="125" x2="90" y2="125" stroke="#006A4E" stroke-width="1.5"/>
  <line x1="60" y1="135" x2="90" y2="135" stroke="#006A4E" stroke-width="1.5"/>
  <line x1="110" y1="115" x2="140" y2="115" stroke="#006A4E" stroke-width="1.5"/>
  <line x1="110" y1="125" x2="140" y2="125" stroke="#006A4E" stroke-width="1.5"/>
  <line x1="110" y1="135" x2="140" y2="135" stroke="#006A4E" stroke-width="1.5"/>
  
  <!-- Mascotte Kossi (garçon) à gauche -->
  <circle cx="35" cy="80" r="12" fill="#FFE66D" stroke="#006A4E" stroke-width="2"/>
  <circle cx="32" cy="78" r="1.5" fill="#006A4E"/>
  <circle cx="38" cy="78" r="1.5" fill="#006A4E"/>
  <path d="M 32 83 Q 35 86 38 83" stroke="#006A4E" stroke-width="1.5" fill="none"/>
  
  <!-- Mascotte Afi (fille) à droite -->
  <circle cx="165" cy="80" r="12" fill="#FFE66D" stroke="#006A4E" stroke-width="2"/>
  <circle cx="162" cy="78" r="1.5" fill="#006A4E"/>
  <circle cx="168" cy="78" r="1.5" fill="#006A4E"/>
  <path d="M 162 83 Q 165 86 168 83" stroke="#006A4E" stroke-width="1.5" fill="none"/>
  <!-- Tresses d'Afi -->
  <line x1="160" y1="72" x2="158" y2="68" stroke="#006A4E" stroke-width="2"/>
  <line x1="170" y1="72" x2="172" y2="68" stroke="#006A4E" stroke-width="2"/>
  
  <!-- Texte "TE" au centre -->
  <text x="100" y="100" font-family="Arial Black, sans-serif" font-size="28" font-weight="bold" fill="#006A4E" text-anchor="middle">TE</text>
  
  <!-- Texte "TogoEnglish Play" en bas -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">TogoEnglish Play</text>
  <text x="100" y="188" font-family="Arial, sans-serif" font-size="9" fill="#FFE66D" text-anchor="middle">🇹🇬 République Togolaise</text>
</svg>
