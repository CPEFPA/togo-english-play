<!DOCTYPE html>
<html lang="fr">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parents CM - TogoEnglish Play</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .back-home-btn { display: inline-flex; align-items: center; background: #FF5722; color: white; padding: 10px 20px; border-radius: 25px; text-decoration: none; font-weight: bold; margin-bottom: 30px; }
        .page-header { text-align: center; margin-bottom: 30px; }
        .page-header h1 { color: #FF5722; font-size: 2em; margin-bottom: 10px; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .video-card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .video-badge { background: #FF5722; color: white; padding: 8px 15px; font-size: 0.9em; font-weight: bold; }
        .video-card h3 { padding: 15px 15px 5px; margin: 0; font-size: 1.1em; color: #333; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .video-info { padding: 15px; color: #666; font-size: 0.95em; }
    </style>
</head>
<body>
    <div class="container" style="padding-top: 40px; padding-bottom: 40px;">
        <a href="/togo-english-play/parents.html" class="back-home-btn">← Retour aux parents</a>
        <div class="page-header">
            <h1>👨‍👩‍👧 Espace Parents CM</h1>
            <p>Toutes les vidéos officielles du Cours Moyen pour accompagner votre enfant</p>
        </div>
        <div class="video-grid" id="videoList"></div>
    </div>
    <script>
        fetch('/togo-english-play/data/videos-cm.json?' + Date.now())
            .then(r => r.json())
            .then(data => {
                const list = document.getElementById('videoList');
                Object.keys(data).forEach(unitKey => {
                    const unit = data[unitKey];
                    unit.weeks.forEach(week => {
                        week.videos.forEach(v => {
                            if(!v.youtubeId) return;
                            const div = document.createElement('div');
                            div.className = 'video-card';
                            div.innerHTML = `<div class="video-badge">${unit.icon} ${unit.title} - Semaine ${week.week}</div>
                                <h3>${v.title}</h3>
                                <div class="video-container"><iframe src="https://www.youtube-nocookie.com/embed/${v.youtubeId}" frameborder="0" allowfullscreen></iframe></div>
                                <div class="video-info"><p>🎯 ${v.objective || ''}</p><p>📅 Jour ${v.day} - ${v.type ? v.type.toUpperCase() : 'VIDEO'}</p></div>`;
                            list.appendChild(div);
                        });
                    });
                });
            });
    </script>
    <script src="/togo-english-play/js/analytics.js"></script>
</body>
</html>
